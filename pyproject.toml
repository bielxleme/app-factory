[project]
name = "appfactory"
version = "0.2.1"
description = "App Factory — fundação do Job Manager (Fase 2.1)"
requires-python = ">=3.10"
# Fase 2.1: sem dependências de execução (somente biblioteca padrão). Ver D-0042.
dependencies = []

[project.scripts]
af = "appfactory.cli.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appfactory"]

# Configuração do pytest: somente em pytest.ini (protegido, 08 §5.1). Proibido [tool.pytest*] aqui.
