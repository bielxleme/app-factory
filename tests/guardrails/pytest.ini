[pytest]
# Configuração PRÓPRIA dos guardrails (08 §5.3): rodada SEMPRE pelo comando fixo
#   python -m pytest -c tests/guardrails/pytest.ini --noconftest -p no:cacheprovider tests/guardrails
# Caminhos relativos a este arquivo. Arquivo protegido (tests/guardrails/**).
pythonpath = ../../src ../..
addopts = -p no:cacheprovider
